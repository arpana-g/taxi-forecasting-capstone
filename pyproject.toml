[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "mlruns", "data", "artifacts", "notebooks"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI dependency-injection idiom uses Depends() in defaults
]

[tool.ruff.lint.isort]
# Pin first-party detection so import ordering is identical across environments
# (local working copy vs. clean CI checkout, which otherwise auto-detect differently).
known-first-party = ["src"]
known-third-party = ["mlflow"]
