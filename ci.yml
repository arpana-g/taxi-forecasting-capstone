# GitHub Actions CI for the taxi-forecasting project.
# Mirrors the quality gate in buildspec.yml (AWS CodeBuild) and scripts/ci_local.ps1:
#   1. Ruff lint
#   2. Pytest with the 75% coverage gate (synthetic data, no downloads or AWS)
#   3. Terraform fmt + validate (no backend, no credentials)
#   4. Docker build of the dependency stage (the full image bakes in trained
#      models from S3, which only the CodeBuild release path has)
# No secrets are used. Deployment to ECR/ECS stays in buildspec.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint + tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest + coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform validate

  docker-build:
    name: Docker build (dependency stage)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build builder stage of docker/Dockerfile
        run: docker build -f docker/Dockerfile --target builder -t taxi-forecasting-builder:${{ github.sha }} .
      - name: Verify core packages import inside the image
        run: |
          docker run --rm taxi-forecasting-builder:${{ github.sha }} \
            /opt/venv/bin/python -c "import fastapi, mlflow, xgboost, lightgbm, pandas; print('image deps OK')"
